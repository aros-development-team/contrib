# The contrib store of crates.io crates for Rust programs (see
# contrib/development/rust/crates): what the core store in
# tools/crosstools/rust.cfg provides for the tree, this provides for the
# application crates - async runtimes, GUI toolkits and what they bring -
# plus the AROS-only crates written for them. A program's mmakefile includes
# this after tools/crosstools/rust.cfg, depends on the contrib-rust-crates-*
# targets it needs and on contrib-rust-crates-config, and runs cargo with
# $(CONTRIB_RUST_CARGO).

CONTRIB_RUST_DIR            := $(SRCDIR)/contrib/development/rust
CONTRIB_RUST_AROS_CRATESDIR := $(CONTRIB_RUST_DIR)/crates/aros
CONTRIB_RUST_CRATES_CONFIG  := $(GENDIR)/contrib/development/rust/crates/contrib-rust-crates.toml
CONTRIB_RUST_CARGO          := $(RUST_CARGO) --config $(CONTRIB_RUST_CRATES_CONFIG)

# The crates in the store and their versions.
CONTRIB_RUST_TOKIO_VERSION          := 1.53.2
CONTRIB_RUST_MIO_VERSION            := 1.2.4
CONTRIB_RUST_SOCKET2_VERSION        := 0.6.5
CONTRIB_RUST_ERRNO_VERSION          := 0.3.14
CONTRIB_RUST_LIBLOADING07_VERSION   := 0.7.4
CONTRIB_RUST_LIBLOADING09_VERSION   := 0.9.0
CONTRIB_RUST_ICED_VERSION           := 0.14.0
CONTRIB_RUST_ICED_TINY_SKIA_VERSION := 0.14.1
CONTRIB_RUST_FONTIQUE_VERSION       := 0.11.1
CONTRIB_RUST_CRATE_TOKIO          := tokio-$(CONTRIB_RUST_TOKIO_VERSION)
CONTRIB_RUST_CRATE_MIO            := mio-$(CONTRIB_RUST_MIO_VERSION)
CONTRIB_RUST_CRATE_SOCKET2        := socket2-$(CONTRIB_RUST_SOCKET2_VERSION)
CONTRIB_RUST_CRATE_ERRNO          := errno-$(CONTRIB_RUST_ERRNO_VERSION)
CONTRIB_RUST_CRATE_LIBLOADING07   := libloading-$(CONTRIB_RUST_LIBLOADING07_VERSION)
CONTRIB_RUST_CRATE_LIBLOADING09   := libloading-$(CONTRIB_RUST_LIBLOADING09_VERSION)
CONTRIB_RUST_CRATE_ICED           := iced-$(CONTRIB_RUST_ICED_VERSION)
CONTRIB_RUST_CRATE_ICED_TINY_SKIA := iced_tiny_skia-$(CONTRIB_RUST_ICED_TINY_SKIA_VERSION)
CONTRIB_RUST_CRATE_FONTIQUE       := fontique-$(CONTRIB_RUST_FONTIQUE_VERSION)

# For %rust_cargo_fetch (see tools/crosstools/rust.cfg): the versions a
# program's Cargo.lock is moved to so that the store's crates are used.
CONTRIB_RUST_CRATES_LOCK := tokio@1:$(CONTRIB_RUST_TOKIO_VERSION) mio@1:$(CONTRIB_RUST_MIO_VERSION) \
    socket2@0.6:$(CONTRIB_RUST_SOCKET2_VERSION) errno@0.3:$(CONTRIB_RUST_ERRNO_VERSION) \
    libloading@0.7:$(CONTRIB_RUST_LIBLOADING07_VERSION) libloading@0.9:$(CONTRIB_RUST_LIBLOADING09_VERSION) \
    iced@0.14:$(CONTRIB_RUST_ICED_VERSION) iced_tiny_skia@0.14:$(CONTRIB_RUST_ICED_TINY_SKIA_VERSION) \
    fontique@0.11:$(CONTRIB_RUST_FONTIQUE_VERSION)
