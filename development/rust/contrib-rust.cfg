CONTRIB_RUST_CRATE_STACKER           := stacker-$(CONTRIB_RUST_STACKER_VERSION)
CONTRIB_RUST_CRATE_WGPU              := wgpu-$(CONTRIB_RUST_WGPU_VERSION)
CONTRIB_RUST_CRATE_WGPU_CORE         := wgpu-core-$(CONTRIB_RUST_WGPU_CORE_VERSION)
CONTRIB_RUST_CRATE_WGPU_CORE_DEPS    := wgpu-core-deps-windows-linux-android-$(CONTRIB_RUST_WGPU_CORE_DEPS_VERSION)
CONTRIB_RUST_CRATE_WGPU_HAL          := wgpu-hal-$(CONTRIB_RUST_WGPU_HAL_VERSION)
CONTRIB_RUST_CRATE_WINDOW_CLIPBOARD  := window_clipboard-$(CONTRIB_RUST_WINDOW_CLIPBOARD_VERSION)
CONTRIB_RUST_CRATE_WINIT             := winit-$(CONTRIB_RUST_WINIT_VERSION)

# For %rust_cargo_fetch (see tools/crosstools/rust.cfg): the versions a
# program's Cargo.lock is moved to so that the store's crates are used.
CONTRIB_RUST_CRATES_LOCK := tokio@1:$(CONTRIB_RUST_TOKIO_VERSION) mio@1:$(CONTRIB_RUST_MIO_VERSION) \
    socket2@0.6:$(CONTRIB_RUST_SOCKET2_VERSION) errno@0.3:$(CONTRIB_RUST_ERRNO_VERSION) \
    libloading@0.7:$(CONTRIB_RUST_LIBLOADING07_VERSION) libloading@0.9:$(CONTRIB_RUST_LIBLOADING09_VERSION) \
    iced@0.14:$(CONTRIB_RUST_ICED_VERSION) iced_tiny_skia@0.14:$(CONTRIB_RUST_ICED_TINY_SKIA_VERSION) \
    fontique@0.11:$(CONTRIB_RUST_FONTIQUE_VERSION) \
    atomicwrites@0.4:$(CONTRIB_RUST_ATOMICWRITES_VERSION) \
    copypasta@0.8:$(CONTRIB_RUST_COPYPASTA_VERSION) cpal@0.16:$(CONTRIB_RUST_CPAL_VERSION) \
    filetime@0.2:$(CONTRIB_RUST_FILETIME_VERSION) glutin@0.32:$(CONTRIB_RUST_GLUTIN_VERSION) \
    kiddo@5:$(CONTRIB_RUST_KIDDO_VERSION) libloading@0.8:$(CONTRIB_RUST_LIBLOADING08_VERSION) \
    libsqlite3-sys@0.35:$(CONTRIB_RUST_LIBSQLITE3_SYS_VERSION) naga@27:$(CONTRIB_RUST_NAGA_VERSION) \
    num_cpus@1:$(CONTRIB_RUST_NUM_CPUS_VERSION) open@5:$(CONTRIB_RUST_OPEN_VERSION) \
    polling@3:$(CONTRIB_RUST_POLLING_VERSION) quinn-udp@0.5:$(CONTRIB_RUST_QUINN_UDP_VERSION) \
    raw-window-handle@0.6:$(CONTRIB_RUST_RAW_WINDOW_HANDLE_VERSION) \
    ring@0.17:$(CONTRIB_RUST_RING_VERSION) socket2@0.5:$(CONTRIB_RUST_SOCKET205_VERSION) \
    stacker@0.1:$(CONTRIB_RUST_STACKER_VERSION) wgpu@27:$(CONTRIB_RUST_WGPU_VERSION) \
    wgpu-core@27:$(CONTRIB_RUST_WGPU_CORE_VERSION) \
    wgpu-core-deps-windows-linux-android@27:$(CONTRIB_RUST_WGPU_CORE_DEPS_VERSION) \
    wgpu-hal@27:$(CONTRIB_RUST_WGPU_HAL_VERSION) \
    window_clipboard@0.5:$(CONTRIB_RUST_WINDOW_CLIPBOARD_VERSION) \
    winit@0.30:$(CONTRIB_RUST_WINIT_VERSION)

# %fetch patches a tree only once, and takes the diff it finds in the
# destination before the one in the source tree, so an edited diff would
# silently not apply. This drops the unpacked tree, its stamps and the copied
# diff when the diff in the source tree is newer than the stamp, so the next
# fetch starts afresh.
#   $(call RUST_REFRESH,<destination>,<archive file>,<unpacked dir>,<diff>)
RUST_REFRESH = if $(TEST) -f "$(1)/.$(4).applied" && \
        $(TEST) "$(SRCDIR)/$(CURDIR)/$(4)" -nt "$(1)/.$(4).applied" ; then \
        $(ECHO) "Refreshing $(3)" ; \
        $(RM) "$(1)/$(3)" "$(1)/.$(2).unpacked" "$(1)/.$(4).applied" "$(1)/$(4)" ; \
    fi
