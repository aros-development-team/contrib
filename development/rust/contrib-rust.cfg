# The contrib store of crates.io crates for Rust programs (see
# contrib/development/rust/crates): what the core store in
# tools/crosstools/rust.cfg provides for the tree, this provides for the
# application crates - async runtimes, GUI toolkits and what they bring -
# plus the AROS-only crates written for them. A program's mmakefile includes
# this after tools/crosstools/rust.cfg, depends on the contrib-rust-crates-*
# targets it needs and on contrib-rust-crates-config, and runs cargo with
# $(CONTRIB_RUST_CARGO).

CONTRIB_RUST_DIR            := $(SRCDIR)/contrib/development/rust
CONTRIB_RUST_AROS_CRATESDIR := $(CONTRIB_RUST_DIR)/crates/aros
CONTRIB_RUST_CRATES_CONFIG  := $(GENDIR)/contrib/development/rust/crates/contrib-rust-crates.toml
CONTRIB_RUST_CARGO          := $(RUST_CARGO) --config $(CONTRIB_RUST_CRATES_CONFIG)

# The crates in the store and their versions.
CONTRIB_RUST_TOKIO_VERSION          := 1.53.2
CONTRIB_RUST_MIO_VERSION            := 1.2.4
CONTRIB_RUST_SOCKET2_VERSION        := 0.6.5
CONTRIB_RUST_ERRNO_VERSION          := 0.3.14
CONTRIB_RUST_LIBLOADING07_VERSION   := 0.7.4
CONTRIB_RUST_LIBLOADING09_VERSION   := 0.9.0
CONTRIB_RUST_ICED_VERSION           := 0.14.0
CONTRIB_RUST_ICED_TINY_SKIA_VERSION := 0.14.1
CONTRIB_RUST_FONTIQUE_VERSION       := 0.11.1
CONTRIB_RUST_CRATE_TOKIO          := tokio-$(CONTRIB_RUST_TOKIO_VERSION)
CONTRIB_RUST_CRATE_MIO            := mio-$(CONTRIB_RUST_MIO_VERSION)
CONTRIB_RUST_CRATE_SOCKET2        := socket2-$(CONTRIB_RUST_SOCKET2_VERSION)
CONTRIB_RUST_CRATE_ERRNO          := errno-$(CONTRIB_RUST_ERRNO_VERSION)
CONTRIB_RUST_CRATE_LIBLOADING07   := libloading-$(CONTRIB_RUST_LIBLOADING07_VERSION)
CONTRIB_RUST_CRATE_LIBLOADING09   := libloading-$(CONTRIB_RUST_LIBLOADING09_VERSION)
CONTRIB_RUST_CRATE_ICED           := iced-$(CONTRIB_RUST_ICED_VERSION)
CONTRIB_RUST_CRATE_ICED_TINY_SKIA := iced_tiny_skia-$(CONTRIB_RUST_ICED_TINY_SKIA_VERSION)
CONTRIB_RUST_CRATE_FONTIQUE       := fontique-$(CONTRIB_RUST_FONTIQUE_VERSION)

# The window, graphics, audio and system crates (winit, wgpu, cpal, ...), from
# the ports' cargo builds (Veloren, alacritty).
CONTRIB_RUST_ATOMICWRITES_VERSION      := 0.4.4
CONTRIB_RUST_COPYPASTA_VERSION         := 0.8.2
CONTRIB_RUST_CPAL_VERSION              := 0.16.0
CONTRIB_RUST_FILETIME_VERSION          := 0.2.26
CONTRIB_RUST_GLUTIN_VERSION            := 0.32.3
CONTRIB_RUST_KIDDO_VERSION             := 5.2.3
CONTRIB_RUST_LIBC0185_VERSION          := 0.2.185
CONTRIB_RUST_LIBLOADING08_VERSION      := 0.8.9
CONTRIB_RUST_LIBSQLITE3_SYS_VERSION    := 0.35.0
CONTRIB_RUST_NAGA_VERSION              := 27.0.3
CONTRIB_RUST_NUM_CPUS_VERSION          := 1.17.0
CONTRIB_RUST_OPEN_VERSION              := 5.4.4
CONTRIB_RUST_POLLING_VERSION           := 3.11.0
CONTRIB_RUST_QUINN_UDP_VERSION         := 0.5.14
CONTRIB_RUST_RAW_WINDOW_HANDLE_VERSION := 0.6.2
CONTRIB_RUST_RING_VERSION              := 0.17.14
CONTRIB_RUST_SOCKET205_VERSION         := 0.5.10
CONTRIB_RUST_STACKER_VERSION           := 0.1.22
CONTRIB_RUST_WGPU_VERSION              := 27.0.1
CONTRIB_RUST_WGPU_CORE_VERSION         := 27.0.3
CONTRIB_RUST_WGPU_CORE_DEPS_VERSION    := 27.0.0
CONTRIB_RUST_WGPU_HAL_VERSION          := 27.0.4
CONTRIB_RUST_WINDOW_CLIPBOARD_VERSION  := 0.5.1
CONTRIB_RUST_WINIT_VERSION             := 0.30.13
CONTRIB_RUST_CRATE_ATOMICWRITES      := atomicwrites-$(CONTRIB_RUST_ATOMICWRITES_VERSION)
CONTRIB_RUST_CRATE_COPYPASTA         := copypasta-$(CONTRIB_RUST_COPYPASTA_VERSION)
CONTRIB_RUST_CRATE_CPAL              := cpal-$(CONTRIB_RUST_CPAL_VERSION)
CONTRIB_RUST_CRATE_FILETIME          := filetime-$(CONTRIB_RUST_FILETIME_VERSION)
CONTRIB_RUST_CRATE_GLUTIN            := glutin-$(CONTRIB_RUST_GLUTIN_VERSION)
CONTRIB_RUST_CRATE_KIDDO             := kiddo-$(CONTRIB_RUST_KIDDO_VERSION)
CONTRIB_RUST_CRATE_LIBC0185          := libc-$(CONTRIB_RUST_LIBC0185_VERSION)
CONTRIB_RUST_CRATE_LIBLOADING08      := libloading-$(CONTRIB_RUST_LIBLOADING08_VERSION)
CONTRIB_RUST_CRATE_LIBSQLITE3_SYS    := libsqlite3-sys-$(CONTRIB_RUST_LIBSQLITE3_SYS_VERSION)
CONTRIB_RUST_CRATE_NAGA              := naga-$(CONTRIB_RUST_NAGA_VERSION)
CONTRIB_RUST_CRATE_NUM_CPUS          := num_cpus-$(CONTRIB_RUST_NUM_CPUS_VERSION)
CONTRIB_RUST_CRATE_OPEN              := open-$(CONTRIB_RUST_OPEN_VERSION)
CONTRIB_RUST_CRATE_POLLING           := polling-$(CONTRIB_RUST_POLLING_VERSION)
CONTRIB_RUST_CRATE_QUINN_UDP         := quinn-udp-$(CONTRIB_RUST_QUINN_UDP_VERSION)
